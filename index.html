<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Interactive dashboard showing investment and income across Irish NUTS2 regions."
		/>
		<title>Irish Regional Investment &amp; Income Dashboard</title>

		<script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
		<script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
		<script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>

		<style>
			:root {
				color-scheme: light;
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				color: #172033;
				background: #f3eef8;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-width: 320px;
			}

			.page-header {
				padding: 28px 24px 22px;
				color: #ffffff;
				background: #795891;
			}

			.page-header__content,
			main {
				width: min(1440px, 100%);
				margin: 0 auto;
			}

			h1 {
				margin: 0 0 6px;
				font-size: clamp(1.45rem, 3vw, 2rem);
				line-height: 1.2;
			}

			.page-header p {
				margin: 0;
				color: #f2ebf6;
				font-size: 0.95rem;
			}

			main {
				padding: 24px;
			}

			.dashboard-card {
				overflow-x: auto;
				padding: 24px;
				border: 1px solid #dfe6ee;
				border-radius: 12px;
				background: #ffffff;
				box-shadow: 0 8px 24px rgba(23, 59, 99, 0.08);
			}

			#vis {
				min-height: 760px;
			}

			#vis .vega-embed {
				width: max-content;
				min-width: 100%;
			}

			.status {
				display: grid;
				min-height: 720px;
				place-items: center;
				color: #5d6878;
				text-align: center;
			}

			.status--error {
				color: #9c2f2f;
			}

			footer {
				padding: 0 24px 24px;
				color: #657184;
				font-size: 0.8rem;
				text-align: center;
			}

			@media (max-width: 640px) {
				.page-header {
					padding: 22px 16px 18px;
				}

				main {
					padding: 16px;
				}

				.dashboard-card {
					padding: 16px;
					border-radius: 8px;
				}
			}
		</style>
	</head>

	<body>
		<header class="page-header">
			<div class="page-header__content">
				<h1>Investment and Income across Irish NUTS2 Regions</h1>
				<p>
					Click a region and drag across the timeline to filter the
					dashboard.
				</p>
			</div>
		</header>

		<main>
			<section
				class="dashboard-card"
				aria-label="Interactive regional dashboard"
			>
				<div id="vis" aria-live="polite">
					<div class="status">Loading dashboard…</div>
				</div>
			</section>
		</main>
		<script>
			const container = document.querySelector('#vis');
			const spec = {
				$schema: 'https://vega.github.io/schema/vega-lite/v6.json',
				data: {
					url: 'https://pub-60d0175aab0d4452b9cd057183cef97d.r2.dev/final_visualization_data.csv',
				},
				vconcat: [
					{
						hconcat: [
							{
								title: 'Average annual investment by region',
								width: 300,
								height: 320,
								transform: [
									{
										filter: {
											param: 'yearBrush',
										},
									},
									{
										aggregate: [
											{
												op: 'mean',
												field: 'GFCF',
												as: 'Avg_GFCF',
											},
										],
										groupby: ['Region_Code', 'Region'],
									},
									{
										lookup: 'Region_Code',
										from: {
											data: {
												url: 'https://cdn.cso.ie/static/map/en/ie_nuts2.json',
												format: {
													type: 'json',
													property: 'features',
												},
											},
											key: 'properties.AREA_ID',
										},
										as: 'geo',
									},
									{
										filter: 'datum.geo != null',
									},
									{
										calculate:
											"datum.Region + '|' + '€' + format(datum.Avg_GFCF, ',.0f') + 'm'",
										as: 'Map_Label',
									},
								],
								projection: {
									type: 'identity',
									reflectY: true,
								},
								layer: [
									{
										params: [
											{
												name: 'regionSelection',
												select: {
													type: 'point',
													fields: ['Region_Code'],
													toggle: false,
													clear: 'dblclick',
												},
											},
										],
										mark: {
											type: 'geoshape',
											cursor: 'pointer',
										},
										encoding: {
											shape: {
												field: 'geo',
												type: 'geojson',
											},
											color: {
												field: 'Avg_GFCF',
												type: 'quantitative',
												title: 'Avg. annual GFCF (€m)',
												scale: {
													scheme: 'blues',
												},
												legend: {
													title: 'Avg. annual GFCF (€m)',
												},
											},
											stroke: {
												condition: {
													param: 'regionSelection',
													empty: false,
													value: '#FFDD55',
												},
												value: '#F0F0F0',
											},
											strokeWidth: {
												condition: {
													param: 'regionSelection',
													empty: false,
													value: 1.4,
												},
												value: 0.7,
											},
										},
									},
									{
										transform: [
											{
												filter: "datum.Region_Code === 'IE04'",
											},
										],
										mark: {
											type: 'text',
											fontSize: 9,
											fontWeight: 'normal',
											fill: '#111111',
											lineBreak: '|',
											lineHeight: 11,
											align: 'center',
										},
										encoding: {
											x: {
												value: 95,
											},
											y: {
												value: 92,
											},
											text: {
												field: 'Map_Label',
												type: 'nominal',
											},
										},
									},
									{
										transform: [
											{
												filter: "datum.Region_Code === 'IE06'",
											},
										],
										mark: {
											type: 'text',
											fontSize: 9,
											fontWeight: 'normal',
											fill: '#111111',
											lineBreak: '|',
											lineHeight: 11,
											align: 'center',
										},
										encoding: {
											x: {
												value: 205,
											},
											y: {
												value: 160,
											},
											text: {
												field: 'Map_Label',
												type: 'nominal',
											},
										},
									},
									{
										transform: [
											{
												filter: "datum.Region_Code === 'IE05'",
											},
										],
										mark: {
											type: 'text',
											fontSize: 9,
											fontWeight: 'normal',
											fill: '#111111',
											lineBreak: '|',
											lineHeight: 11,
											align: 'center',
										},
										encoding: {
											x: {
												value: 130,
											},
											y: {
												value: 245,
											},
											text: {
												field: 'Map_Label',
												type: 'nominal',
											},
										},
									},
								],
							},
							{
								title: 'Investment and income over time',
								width: 460,
								height: 320,
								transform: [
									{
										filter: {
											param: 'regionSelection',
										},
									},
									{
										fold: ['GFCF_Index', 'Income_Index'],
										as: ['Metric', 'Index'],
									},
								],
								params: [
									{
										name: 'yearBrush',
										select: {
											type: 'interval',
											encodings: ['x'],
											clear: 'dblclick',
											translate: true,
											zoom: false,
											mark: {
												fillOpacity: 0.15,
												strokeWidth: 1,
											},
										},
									},
								],
								mark: {
									type: 'line',
								},
								encoding: {
									x: {
										field: 'Year',
										type: 'quantitative',
										scale: {
											domain: [2000, 2022],
										},
										axis: {
											title: 'Year',
											format: 'd',
											tickMinStep: 1,
										},
									},
									y: {
										field: 'Index',
										type: 'quantitative',
										axis: {
											title: 'Index (2000 = 100)',
										},
									},
									color: {
										field: 'Region',
										type: 'nominal',
										title: 'Region',
										scale: {
											domain: [
												'Northern & Western',
												'Southern',
												'Eastern & Midland',
											],
											range: [
												'#4C78A8',
												'#F58518',
												'#54A24B',
											],
										},
										legend: {
											orient: 'right',
											direction: 'vertical',
											columns: 1,
											titleOrient: 'top',
										},
									},
									strokeDash: {
										field: 'Metric',
										type: 'nominal',
										title: 'Indicator',
										scale: {
											domain: [
												'GFCF_Index',
												'Income_Index',
											],
											range: [
												[1, 0],
												[6, 4],
											],
										},
										legend: {
											orient: 'right',
											direction: 'vertical',
											columns: 1,
											titleOrient: 'top',
											labelExpr:
												"replace(datum.label, '_', ' ')",
										},
									},
									detail: [
										{
											field: 'Region_Code',
										},
										{
											field: 'Metric',
										},
									],
									tooltip: [
										{
											field: 'Region',
											type: 'nominal',
											title: 'Region',
										},
										{
											field: 'Year',
											type: 'quantitative',
											format: 'd',
											title: 'Year',
										},
										{
											field: 'Metric',
											type: 'nominal',
											title: 'Indicator',
										},
										{
											field: 'Index',
											type: 'quantitative',
											format: '.1f',
											title: 'Index',
										},
									],
								},
							},
						],
						spacing: 20,
						resolve: {
							scale: {
								color: 'independent',
								strokeDash: 'independent',
							},
						},
					},
					{
						title: 'Relationship between investment and income',
						width: 800,
						height: 340,
						transform: [
							{
								filter: {
									param: 'regionSelection',
								},
							},
							{
								filter: {
									param: 'yearBrush',
								},
							},
						],
						mark: {
							type: 'point',
							filled: true,
							size: 90,
						},
						encoding: {
							x: {
								field: 'GFCF_Index',
								type: 'quantitative',
								axis: {
									title: 'GFCF Index (2000 = 100)',
								},
							},
							y: {
								field: 'Income_Index',
								type: 'quantitative',
								axis: {
									title: 'Disposable Income Index (2000 = 100)',
								},
							},
							color: {
								field: 'Region',
								type: 'nominal',
								scale: {
									domain: [
										'Northern & Western',
										'Southern',
										'Eastern & Midland',
									],
									range: ['#4C78A8', '#F58518', '#54A24B'],
								},
								legend: null,
							},
							tooltip: [
								{
									field: 'Region',
									type: 'nominal',
									title: 'Region',
								},
								{
									field: 'Year',
									type: 'quantitative',
									format: 'd',
									title: 'Year',
								},
								{
									field: 'GFCF_Index',
									type: 'quantitative',
									format: '.1f',
									title: 'GFCF Index',
								},
								{
									field: 'Income_Index',
									type: 'quantitative',
									format: '.1f',
									title: 'Income Index',
								},
							],
						},
					},
				],
				spacing: 35,
				resolve: {
					scale: {
						color: 'independent',
						strokeDash: 'independent',
					},
				},
				config: {
					view: {
						stroke: null,
					},
					axis: {
						labelFontSize: 11,
						titleFontSize: 12,
						titlePadding: 10,
					},
					legend: {
						labelFontSize: 11,
						titleFontSize: 12,
					},
					title: {
						fontSize: 15,
						subtitleFontSize: 11,
						anchor: 'start',
						offset: 24,
					},
				},
			};
			vegaEmbed(container, spec, {
				actions: false,
				renderer: 'svg',
			}).catch((error) => {
				console.error(error);
				container.innerHTML = `
          <div class="status status--error">
            <div>
              <strong>The dashboard could not be loaded.</strong><br />
              Please check your internet connection and try again.
            </div>
          </div>
        `;
			});
		</script>
	</body>
</html>
